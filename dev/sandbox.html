<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellar motion sandbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/spellar.css">
<style>
  body { margin: 0; padding: 12px 0 140px; background: #fff; font: 14px/1.4 "Source Sans 3", sans-serif; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .controls button, .controls select { font: inherit; padding: 6px 12px; }
</style>
</head>
<body>
<!-- Dev only. Scrub each timeline with the GSDevTools bar at the bottom of the page. -->
<div class="controls">
  <label>Letters <select id="len"><option>4</option><option>5</option><option>6</option><option selected>7</option></select></label>
  <button id="pop">1. Letter pop</button>
  <button id="reveal">2. Star reveal</button>
  <button id="shake">3. Invalid shake</button>
  <button id="win">4. Constellation (win)</button>
  <button id="lose">4. Constellation (loss)</button>
  <button id="title">5. Title swap</button>
</div>
<div class="spellar" id="spellar-root"></div>
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="/node_modules/gsap/dist/GSDevTools.min.js"></script>
<script src="/dev/sandbox.js"></script>
</body>
</html>
